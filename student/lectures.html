<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function hasLoginCookie() {
            return document.cookie.split('; ').some(c => c === 'logged_in=true');
        }
        if (!hasLoginCookie()) {
            window.location.replace('../login.html');
        }
        window.addEventListener('pageshow', function (event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                if (!hasLoginCookie()) {
                    window.location.replace('../login.html');
                }
            }
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Lecture — Pariksha Parikrama</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: #0d0d0d; color: var(--white); min-height: 100vh; }
        .lecture-topbar { background: rgba(20,33,61,0.98); padding: 12px 0; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(233,185,73,0.15); }
        .lecture-topbar .inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 24px; max-width: 1400px; margin: 0 auto; }
        .lecture-topbar .back-btn { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.7); font-size: 0.88rem; transition: color 0.2s; cursor: pointer; }
        .lecture-topbar .back-btn:hover { color: var(--warm-gold); }
        .lecture-topbar .course-title-bar { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--white); }
        .lecture-topbar .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: rgba(255,255,255,0.6); }
        .lecture-topbar .user-info .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,var(--deep-maroon),var(--navy-blue)); display:flex;align-items:center;justify-content:center; font-size:0.78rem; font-weight:700; }

        .lecture-layout { display: grid; grid-template-columns: 1fr 360px; min-height: calc(100vh - 64px); }
        .lecture-player-area { padding: 24px; display: flex; flex-direction: column; gap: 20px; }

        /* Video container */
        .video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .video-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
        .watermark-layer { position: absolute; z-index: 10; pointer-events: none; user-select: none; animation: watermarkPulse 3s ease-in-out infinite; transition: top 5s ease, left 5s ease; }
        .watermark-layer .wm-text { background: rgba(0,0,0,0.22); padding: 8px 16px; border-radius: 8px; text-align: center; }
        .watermark-layer .wm-text p { color: rgba(255,255,255,0.48); font-size: 0.82rem; font-weight: 700; line-height: 1.5; letter-spacing: 0.8px; text-shadow: 1px 1px 4px rgba(0,0,0,0.9); white-space: nowrap; font-family: 'Inter', sans-serif; }
        @keyframes watermarkPulse { 0%,100%{opacity:0.5} 50%{opacity:0.7} }

        .video-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: rgba(255,255,255,0.3); gap: 16px; }
        .video-placeholder i { font-size: 4rem; }
        .video-placeholder p { font-size: 1rem; }

        /* Lecture Info */
        .lecture-info-bar { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px 24px; }
        .lecture-info-bar h2 { font-size: 1.4rem; color: var(--white); margin-bottom: 8px; }
        .lecture-info-bar p { font-size: 0.9rem; color: rgba(255,255,255,0.6); }
        .lecture-nav-btns { display: flex; gap: 12px; margin-top: 16px; }
        .nav-btn { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: var(--transition); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); background: none; }
        .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); color: var(--white); border-color: rgba(255,255,255,0.3); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Notes Section */
        .notes-section { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px 24px; }
        .notes-section h3 { font-size: 1rem; color: rgba(255,255,255,0.9); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; }
        .notes-section h3 i { color: var(--warm-gold); }
        .notes-list { display: flex; flex-direction: column; gap: 10px; }
        .note-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: rgba(255,255,255,0.05); border-radius: 10px; border: 1px solid rgba(255,255,255,0.07); transition: background 0.2s; }
        .note-item:hover { background: rgba(255,255,255,0.09); }
        .note-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(239,68,68,0.2); display: flex; align-items: center; justify-content: center; color: #f87171; font-size: 1rem; flex-shrink: 0; }
        .note-info { flex: 1; }
        .note-info h4 { font-size: 0.88rem; font-family: 'Inter', sans-serif; font-weight: 600; color: var(--white); margin-bottom: 2px; }
        .note-actions { display: flex; gap: 8px; }
        .note-btn { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: var(--transition); border: none; }
        .note-btn-view { background: rgba(20,33,61,0.6); color: rgba(255,255,255,0.8); }
        .note-btn-view:hover { background: var(--navy-blue); color: var(--white); }
        .note-btn-dl { background: rgba(107,30,30,0.5); color: rgba(255,255,255,0.8); }
        .note-btn-dl:hover { background: var(--deep-maroon); color: var(--white); }

        /* Sidebar - Lecture List */
        .lecture-sidebar { background: rgba(255,255,255,0.03); border-left: 1px solid rgba(255,255,255,0.08); padding: 20px 0; overflow-y: auto; height: calc(100vh - 64px); position: sticky; top: 64px; }
        .sidebar-header { padding: 0 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-header h3 { font-size: 0.95rem; color: rgba(255,255,255,0.9); font-family: 'Inter', sans-serif; font-weight: 700; }
        .sidebar-header p { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-top: 4px; }
        .lecture-list-panel { padding: 12px 0; }
        .lp-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; transition: background 0.2s; border-left: 3px solid transparent; }
        .lp-item:hover { background: rgba(255,255,255,0.05); }
        .lp-item.active { background: rgba(233,185,73,0.08); border-left-color: var(--warm-gold); }
        .lp-num { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.5); flex-shrink: 0; }
        .lp-item.active .lp-num { background: var(--warm-gold); color: var(--navy-blue); }
        .lp-info h4 { font-size: 0.85rem; font-family: 'Inter', sans-serif; font-weight: 600; color: rgba(255,255,255,0.8); line-height: 1.4; }
        .lp-info span { font-size: 0.75rem; color: rgba(255,255,255,0.35); }

        /* Security overlay - right click & text select disabled */
        .video-wrap { -webkit-user-select: none; user-select: none; }

        @media (max-width: 900px) {
            .lecture-layout { grid-template-columns: 1fr; }
            .lecture-sidebar { height: auto; position: static; border-left: none; border-top: 1px solid rgba(255,255,255,0.08); }
        }
        @media (max-width: 600px) {
            .lecture-player-area { padding: 12px; }
            .lecture-topbar .course-title-bar { display: none; }
        }
    </style>
</head>
<body>
    <!-- Topbar -->
    <div class="lecture-topbar">
        <div class="inner">
            <a href="courses.html" class="back-btn"><i class="fas fa-arrow-left"></i> My Courses</a>
            <span class="course-title-bar" id="topbar-course-title">Loading...</span>
            <div class="user-info">
                <div class="avatar" id="topbar-avatar">?</div>
                <span id="topbar-name">—</span>
            </div>
        </div>
    </div>

    <div class="lecture-layout">
        <!-- Player Area -->
        <div class="lecture-player-area">
            <!-- Video -->
            <div class="video-wrap" id="video-wrap">
                <div class="video-placeholder" id="video-placeholder">
                    <i class="fas fa-play-circle"></i>
                    <p>Select a lecture from the list to start watching</p>
                </div>
                <!-- Watermark overlay -->
                <div class="watermark-layer" id="watermark" style="top:20%;left:60%;display:none;">
                    <div class="wm-text">
                        <p id="wm-name">Student Name</p>
                        <p id="wm-mobile">+91 XXXXXXXXXX</p>
                    </div>
                </div>
            </div>

            <!-- Lecture Info -->
            <div class="lecture-info-bar" id="lecture-info-bar" style="display:none;">
                <h2 id="current-lecture-title">—</h2>
                <p id="current-lecture-desc">—</p>
                <div class="lecture-nav-btns">
                    <button class="nav-btn" id="prev-btn" onclick="navigateLecture(-1)" disabled><i class="fas fa-step-backward"></i> Previous</button>
                    <button class="nav-btn" id="next-btn" onclick="navigateLecture(1)" disabled><i class="fas fa-step-forward"></i> Next Lecture</button>
                </div>
            </div>

            <!-- Notes -->
            <div class="notes-section" id="notes-section">
                <h3><i class="fas fa-file-pdf"></i> Course Notes &amp; Materials</h3>
                <div id="notes-loading" class="loading-state"><div class="spinner" style="border-color:rgba(255,255,255,0.1);border-top-color:var(--warm-gold);"></div></div>
                <div class="notes-list" id="notes-list" style="display:none;"></div>
                <div id="no-notes" class="empty-state" style="display:none;color:rgba(255,255,255,0.3);">
                    <i class="fas fa-folder-open"></i>
                    <h3 style="color:rgba(255,255,255,0.5);">No materials yet</h3>
                    <p>Materials will appear here when added by admin.</p>
                </div>
            </div>
        </div>

        <!-- Lecture List Sidebar -->
        <aside class="lecture-sidebar">
            <div class="sidebar-header">
                <h3>Lecture List</h3>
                <p id="lecture-count-label">Loading...</p>
            </div>
            <div id="lecture-list-loading" class="loading-state"><div class="spinner" style="border-color:rgba(255,255,255,0.1);border-top-color:var(--warm-gold);"></div></div>
            <div class="lecture-list-panel" id="lecture-list-panel"></div>
        </aside>
    </div>

    <script type="module">
        import { requireAuth, getUserProfile } from '../js/auth.js';
        import { getLectures, getNotes, getCourse, isEnrolled } from '../js/db.js';

        const params = new URLSearchParams(window.location.search);
        const courseId = params.get('courseId');
        let lectures = [];
        let currentIndex = -1;
        let studentName = '', studentMobile = '';
        let wmInterval = null;

        if (!courseId) window.location.href = 'courses.html';

        async function init() {
            try {
                const user = await requireAuth('student', '../login.html');
                const profile = await getUserProfile(user.uid);
                if (!profile || !profile.isActive) { window.location.href = '../login.html'; return; }

                studentName = profile.name;
                studentMobile = profile.mobile || '';
                document.getElementById('topbar-avatar').textContent = profile.name.charAt(0).toUpperCase();
                document.getElementById('topbar-name').textContent = profile.name;

                // Set watermark
                document.getElementById('wm-name').textContent = studentName;
                document.getElementById('wm-mobile').textContent = studentMobile ? '+91 ' + studentMobile : '';

                // Check enrollment
                const enrolled = await isEnrolled(user.uid, courseId);
                if (!enrolled) { window.location.href = 'courses.html'; return; }

                // Load course
                const course = await getCourse(courseId);
                if (course) document.getElementById('topbar-course-title').textContent = course.title;

                // Load lectures
                lectures = await getLectures(courseId);
                document.getElementById('lecture-list-loading').style.display = 'none';
                document.getElementById('lecture-count-label').textContent = `${lectures.length} lecture${lectures.length !== 1 ? 's' : ''}`;
                renderLectureList();

                // Load notes
                const notes = await getNotes(courseId);
                document.getElementById('notes-loading').style.display = 'none';
                if (notes.length === 0) {
                    document.getElementById('no-notes').style.display = 'block';
                } else {
                    const list = document.getElementById('notes-list');
                    list.style.display = 'flex';
                    notes.forEach(n => {
                        const div = document.createElement('div');
                        div.className = 'note-item';
                        div.innerHTML = `
                            <div class="note-icon"><i class="fas fa-file-pdf"></i></div>
                            <div class="note-info"><h4>${n.title}</h4></div>
                            <div class="note-actions">
                                <button class="note-btn note-btn-view" onclick="openPdf('${n.pdfUrl}')"><i class="fas fa-eye"></i> View</button>
                                <button class="note-btn note-btn-dl" onclick="downloadPdf('${n.pdfUrl}','${n.title}')"><i class="fas fa-download"></i></button>
                            </div>`;
                        list.appendChild(div);
                    });
                }

            } catch(e) { console.error(e); }
        }

        function renderLectureList() {
            const panel = document.getElementById('lecture-list-panel');
            panel.innerHTML = '';
            lectures.forEach((lec, i) => {
                const div = document.createElement('div');
                div.className = `lp-item${i === currentIndex ? ' active' : ''}`;
                div.id = `lp-${i}`;
                div.innerHTML = `
                    <div class="lp-num">${i + 1}</div>
                    <div class="lp-info">
                        <h4>${lec.title}</h4>
                        <span>${lec.description ? lec.description.substring(0,40)+'...' : 'Click to play'}</span>
                    </div>`;
                div.onclick = () => playLecture(i);
                panel.appendChild(div);
            });
        }

        window.playLecture = (index) => {
            if (index < 0 || index >= lectures.length) return;
            currentIndex = index;
            const lec = lectures[index];

            // Update active in list
            document.querySelectorAll('.lp-item').forEach(el => el.classList.remove('active'));
            const item = document.getElementById(`lp-${index}`);
            if (item) { item.classList.add('active'); item.scrollIntoView({ behavior:'smooth', block:'nearest' }); }

            // Build embed URL from Google Drive link
            const embedUrl = buildEmbedUrl(lec.videoUrl);

            const videoWrap = document.getElementById('video-wrap');
            videoWrap.innerHTML = `
                <iframe src="${embedUrl}" allowfullscreen allow="autoplay; encrypted-media" referrerpolicy="no-referrer" oncontextmenu="return false;"></iframe>
                <div class="watermark-layer" id="watermark" style="top:15%;left:55%;">
                    <div class="wm-text">
                        <p id="wm-name">${studentName}</p>
                        <p id="wm-mobile">${studentMobile ? '+91 '+studentMobile : ''}</p>
                    </div>
                </div>`;

            // Watermark movement
            clearInterval(wmInterval);
            wmInterval = setInterval(moveWatermark, 5000);
            moveWatermark();

            // Info bar
            document.getElementById('lecture-info-bar').style.display = 'block';
            document.getElementById('current-lecture-title').textContent = lec.title;
            document.getElementById('current-lecture-desc').textContent = lec.description || '';

            // Nav buttons
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === lectures.length - 1;
        };

        function buildEmbedUrl(url) {
            if (!url) return '';
            // Google Drive: https://drive.google.com/file/d/FILE_ID/view
            const gdMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (gdMatch) return `https://drive.google.com/file/d/${gdMatch[1]}/preview`;
            // YouTube
            const ytMatch = url.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
            if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}?rel=0`;
            // Direct URL
            return url;
        }

        function moveWatermark() {
            const wm = document.getElementById('watermark');
            if (!wm) return;
            const positions = [
                { top: '8%', left: '5%' }, { top: '8%', left: '55%' },
                { top: '40%', left: '8%' }, { top: '40%', left: '60%' },
                { top: '75%', left: '5%' }, { top: '75%', left: '55%' },
                { top: '20%', left: '30%' }, { top: '60%', left: '35%' }
            ];
            const pos = positions[Math.floor(Math.random() * positions.length)];
            wm.style.top = pos.top;
            wm.style.left = pos.left;
        }

        window.navigateLecture = (dir) => {
            const next = currentIndex + dir;
            if (next >= 0 && next < lectures.length) playLecture(next);
        };

        window.openPdf = (url) => {
            const viewUrl = convertGDriveViewUrl(url);
            window.open(viewUrl, '_blank');
        };

        window.downloadPdf = (url, title) => {
            const a = document.createElement('a');
            a.href = url;
            a.download = title + '.pdf';
            a.target = '_blank';
            a.click();
        };

        function convertGDriveViewUrl(url) {
            const gdMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (gdMatch) return `https://drive.google.com/file/d/${gdMatch[1]}/view`;
            return url;
        }

        // Disable right click on page
        document.addEventListener('contextmenu', e => e.preventDefault());

        init();
    </script>
</body>
</html>
