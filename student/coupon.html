<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        function hasLoginCookie() {
            return document.cookie.split('; ').some(c => c === 'logged_in=true');
        }
        if (!hasLoginCookie()) {
            window.location.replace('../login.html');
        }
        window.addEventListener('pageshow', function (event) {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                if (!hasLoginCookie()) {
                    window.location.replace('../login.html');
                }
            }
        });
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redeem Course Access — Pariksha Parikrama</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .coupon-hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            position: relative;
            overflow: hidden;
        }

        .coupon-hero::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(233, 185, 73, 0.12), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .coupon-hero::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(107, 30, 30, 0.08), transparent);
            border-radius: 50%;
            pointer-events: none;
        }

        .coupon-box {
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.12);
            padding: 56px 48px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid var(--border);
            animation: slideInUp 0.5s ease;
        }

        .coupon-box .icon-ring {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--warm-gold), #F0C040);
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            color: var(--navy-blue);
            box-shadow: 0 10px 28px rgba(233, 185, 73, 0.4);
        }

        .coupon-box h1 {
            font-size: 2rem;
            color: var(--navy-blue);
            margin-bottom: 12px;
        }

        .coupon-box .subtitle {
            font-size: 1rem;
            color: var(--medium-gray);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .coupon-input-wrap {
            margin-bottom: 24px;
        }

        .coupon-input {
            width: 100%;
            padding: 18px 24px;
            border: 2.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
            transition: border-color 0.25s, box-shadow 0.25s;
            color: var(--navy-blue);
            font-family: 'Inter', monospace;
        }

        .coupon-input:focus {
            border-color: var(--deep-maroon);
            box-shadow: 0 0 0 4px rgba(107, 30, 30, 0.1);
            outline: none;
        }

        .coupon-input.success-state {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .coupon-input.error-state {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .skip-link {
            display: block;
            margin-top: 20px;
            color: var(--medium-gray);
            font-size: 0.88rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .skip-link:hover {
            color: var(--deep-maroon);
        }

        .course-preview {
            background: var(--soft-cream);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
            display: none;
        }

        .course-preview.show {
            display: block;
            animation: slideInUp 0.3s ease;
        }

        .course-preview h4 {
            font-size: 1rem;
            color: var(--navy-blue);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .course-preview p {
            font-size: 0.88rem;
            color: var(--medium-gray);
        }

        .course-preview .cp-badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.15);
            color: #15803d;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 50px;
            margin-bottom: 8px;
        }

        .already-enrolled {
            background: rgba(20, 33, 61, 0.05);
            border: 1px solid rgba(20, 33, 61, 0.12);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .already-enrolled h4 {
            font-size: 1rem;
            color: var(--navy-blue);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .enrolled-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }

        .enrolled-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--white);
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--dark-text);
        }

        .enrolled-item i {
            color: var(--warm-gold);
        }

        .simple-header {
            background: rgba(250, 244, 232, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .simple-header .header-inner {
            justify-content: space-between;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            color: var(--medium-gray);
        }

        .user-chip .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--deep-maroon), var(--navy-blue));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .coupon-box {
                padding: 40px 24px;
            }

            .coupon-input {
                font-size: 1rem;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>
    <header class="simple-header">
        <div class="container">
            <div class="header-inner">
                <span class="logo-text">PARIKSHA PARIKRAMA</span>
                <div class="user-chip">
                    <div class="avatar" id="user-avatar">?</div>
                    <span id="user-name-display">Loading...</span>
                </div>
            </div>
        </div>
    </header>

    <div class="coupon-hero">
        <div class="coupon-box">
            <div class="icon-ring"><i class="fas fa-ticket-alt"></i></div>
            <h1>Enter Coupon Code</h1>
            <p class="subtitle">Enter the coupon code provided by your admin to unlock access to a course.</p>

            <div id="auth-alert" class="alert" style="display:none; margin-bottom:20px;"></div>

            <!-- Already enrolled courses -->
            <div class="already-enrolled" id="enrolled-section" style="display:none;">
                <h4><i class="fas fa-check-circle" style="color:#22c55e;"></i> Your Enrolled Courses</h4>
                <div class="enrolled-list" id="enrolled-list"></div>
            </div>

            <!-- Course preview after validation -->
            <div class="course-preview" id="course-preview">
                <span class="cp-badge">✓ Valid Coupon</span>
                <h4 id="preview-course-name">—</h4>
                <p id="preview-course-desc">—</p>
            </div>

            <div class="coupon-input-wrap">
                <input type="text" id="coupon-code" class="coupon-input" placeholder="PP-XXXXXXXX" maxlength="14"
                    oninput="formatCoupon(this)" autocomplete="off" autocorrect="off" spellcheck="false">
            </div>

            <div id="action-buttons">
                <button class="btn btn-primary btn-block btn-lg" id="validate-btn" onclick="validateCoupon()">
                    <i class="fas fa-unlock"></i> Unlock Course
                </button>
            </div>

            <a href="dashboard.html" class="skip-link" id="skip-link" style="display:none;">
                <i class="fas fa-arrow-right"></i> Go to Dashboard without redeeming
            </a>
        </div>
    </div>

    <div id="toast-container"></div>

    <script type="module">
        import {
            requireAuth,
            getUserProfile
        } from '../js/auth.js';

        import {
            redeemCoupon,
            getCourse,
            getEnrollments
        } from '../js/db.js';

        let currentUser = null;
        let currentProfile = null;

        async function init() {
            try {
                const user = await requireAuth('student', '../login.html');
                currentUser = user;
                const profile = await getUserProfile(user.uid);
                currentProfile = profile;
                document.getElementById('user-name-display').textContent = profile.name;
                document.getElementById('user-avatar').textContent = profile.name.charAt(0).toUpperCase();

                // Load already enrolled courses
                await loadEnrolledCourses();
            } catch (e) { }
        }

        async function loadEnrolledCourses() {
            try {
                const { getCourse: gc } = await import('../js/db.js');
                const enrollments = await getEnrollments(currentUser.uid);
                if (enrollments.length > 0) {
                    document.getElementById('enrolled-section').style.display = 'block';
                    document.getElementById('skip-link').style.display = 'block';
                    const list = document.getElementById('enrolled-list');
                    for (const en of enrollments) {
                        const course = await getCourse(en.courseId);
                        if (course) {
                            const div = document.createElement('div');
                            div.className = 'enrolled-item';
                            div.innerHTML = `<i class="fas fa-book-open"></i> ${course.title}`;
                            list.appendChild(div);
                        }
                    }
                }
            } catch (e) { }
        }

        window.formatCoupon = (inp) => {
            inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
            inp.classList.remove('success-state', 'error-state');
            document.getElementById('course-preview').classList.remove('show');

        };

        window.validateCoupon = async () => {
            const code =
                document.getElementById('coupon-code')
                    .value
                    .trim()
                    .toUpperCase();

            if (!code) {
                return showAlert(
                    'Please enter a coupon code.',
                    'error'
                );
            }

            const btn =
                document.getElementById('validate-btn');

            const originalBtn = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Redeeming...';

            hideAlert();

            try {

                // Redeem coupon (auto enrolls)
                const result =
                    await redeemCoupon(
                        currentUser.uid,
                        code
                    );

                // Get course details
                const course =
                    await getCourse(result.courseId);

                document
                    .getElementById('coupon-code')
                    .classList
                    .add('success-state');

                document
                    .getElementById('preview-course-name')
                    .textContent =
                    course?.title || 'Course';

                document
                    .getElementById('preview-course-desc')
                    .textContent =
                    course?.description ||
                    'Successfully unlocked';

                document
                    .getElementById('course-preview')
                    .classList
                    .add('show');

                showAlert(
                    `🎉 Successfully enrolled in "${course.title}"`,
                    'success'
                );

                btn.innerHTML =
                    '<i class="fas fa-check"></i> Success';

                setTimeout(() => {
                    window.location.href =
                        'dashboard.html';
                }, 1500);

            } catch (err) {

                document
                    .getElementById('coupon-code')
                    .classList
                    .add('error-state');

                showAlert(
                    err.message ||
                    'Invalid coupon code',
                    'error'
                );

                btn.disabled = false;
                btn.innerHTML = originalBtn;
            }
        };



        function showAlert(msg, type = 'error') {
            const el = document.getElementById('auth-alert');
            el.className = `alert alert-${type}`;
            el.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}`;
            el.style.display = 'flex';
        }
        function hideAlert() { document.getElementById('auth-alert').style.display = 'none'; }

        init();
    </script>
</body>

</html>
